# Defaults for all environments. Secrets and environment-specific values come
# from environment variables (see ../.env.example); never commit real secrets.
spring:
  application:
    name: pw-aquatics
  threads:
    virtual:
      enabled: true
  datasource:
    # 5433 is the host port docker-compose.yml publishes PostgreSQL on.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pwaquatics}
    username: ${SPRING_DATASOURCE_USERNAME:pwaquatics}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads lazy collections (variants, colours, images) for a whole page in a few queries.
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Product photos (admin only); larger files are refused with 413 FILE_TOO_LARGE.
      max-file-size: 15MB
      max-request-size: 16MB
  session:
    # Idle time after which a login expires.
    timeout: 14d
    jdbc:
      # Tables are created by Flyway (V2026_11_10_1400).
      initialize-schema: never

server:
  # Applies X-Forwarded-* from the reverse proxy. The backend must only be
  # reachable through Caddy, never directly from the internet.
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Mail is delivered through the retrying outbox; an SMTP outage must not
    # mark the API as unhealthy.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api/v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cookies:
    secure: ${APP_COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:PW Aquatics <no-reply@localhost>}
    shop-inbox: ${SHOP_INBOX_EMAIL:shop@localhost}
  outbox:
    scheduler-enabled: true
    poll-interval: PT10S
    batch-size: 20
    max-attempts: 10
  media:
    local-path: ${MEDIA_LOCAL_PATH:./media}
    public-path: /media
  security:
    # After this many wrong passwords in a row the account is locked for lock-duration.
    max-failed-logins: 10
    lock-duration: PT15M
    verification-token-ttl: PT48H
    password-reset-token-ttl: PT1H
  shipping:
    # Days needed before a parcel can leave: an order placed today ships on the
    # first dispatch weekday that is at least this many days away.
    handling-days: ${SHIPPING_HANDLING_DAYS:1}
    # Carriers offered when the shop enters a shipment; {trackingNumber} is replaced in the
    # tracking link sent to the customer.
    carriers:
      - name: DHL
        tracking-url: https://www.dhl.com/de-en/home/tracking/tracking-parcel.html?submit=1&tracking-id={trackingNumber}
      - name: DHL Express
        tracking-url: https://www.dhl.com/de-en/home/tracking/tracking-express.html?submit=1&tracking-id={trackingNumber}
  orders:
    # Unpaid bank-transfer orders are cancelled after this many days and their stock is returned.
    bank-transfer-payment-days: ${ORDER_BANK_TRANSFER_PAYMENT_DAYS:7}
    # Unpaid card orders are cancelled this many minutes after they were placed.
    card-payment-minutes: ${ORDER_CARD_PAYMENT_MINUTES:60}
  # Bank account shown to customers who pay by bank transfer. Without an IBAN the
  # payment method is not offered and no orders can be placed.
  bank-transfer:
    account-holder: ${BANK_ACCOUNT_HOLDER:}
    iban: ${BANK_IBAN:}
    bic: ${BANK_BIC:}
    bank-name: ${BANK_NAME:}
  # Online payments through Stripe (cards, Apple Pay, Google Pay). Offered only when all three
  # are set. The webhook secret belongs to the endpoint /api/v1/webhooks/stripe.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # How long personal data is kept where no law requires longer (docs/DATABASE.md §6).
  # Orders are not listed here: they are business records with statutory retention.
  retention:
    # The text of an email is erased as soon as it is sent; recipient and subject go after this.
    sent-emails: 30d
    failed-emails: 30d
    # IP addresses in the audit log (security records); the entries themselves stay.
    audit-ip-addresses: 90d
    contact-messages: 365d
    # Processed payment webhook deliveries (ids, amounts and statuses only).
    payment-webhook-events: 90d
  # Optional first administrator, created at startup if no admin exists yet.
  admin-bootstrap:
    email: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
    password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:}
  rate-limits:
    contact:
      capacity: 3
      period: PT1H
    # Login attempts per client IP and per email address (whether or not the account exists).
    login-ip:
      capacity: 30
      period: PT1M
    login-email:
      capacity: 10
      period: PT15M
    # Registration, verification re-send and password-reset requests per client IP.
    auth-email:
      capacity: 5
      period: PT1H
    # Cart changes per client IP.
    cart-write:
      capacity: 120
      period: PT1M
    # Orders placed per customer.
    checkout-order:
      capacity: 10
      period: PT1M
    # Order cancellations per customer.
    order-cancel:
      capacity: 10
      period: PT1M
    # Opening the card payment form per customer (each call asks Stripe).
    card-payment:
      capacity: 20
      period: PT1M
    # Webhook deliveries per client IP, before the signature check.
    payment-webhook:
      capacity: 300
      period: PT1M
    # Password confirmations inside a session (change password/email, delete account).
    password-check:
      capacity: 10
      period: PT15M

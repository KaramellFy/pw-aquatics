# Local development: insecure cookies over http://localhost, API docs on,
# demo data loaded from db/seed-dev.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev

app:
  cookies:
    secure: false
  # Obviously fake account for local development; never a real one.
  bank-transfer:
    account-holder: ${BANK_ACCOUNT_HOLDER:PW Aquatics (dev)}
    iban: ${BANK_IBAN:DE00 0000 0000 0000 0000 00}
    bic: ${BANK_BIC:DEVBDEFFXXX}
    bank-name: ${BANK_NAME:Development Bank}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

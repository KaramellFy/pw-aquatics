app:
  cookies:
    secure: false
  security:
    encryption-key: /CItzREQ27Q+/IL0bmdEFEK1/ST+AzHSBuccvj8TTP0=
  outbox:
    scheduler-enabled: false
  mail:
    shop-inbox: shop@test.local
  media:
    local-path: ${java.io.tmpdir}/pw-aquatics-test-media
  bank-transfer:
    account-holder: PW Aquatics Test
    iban: DE00 0000 0000 0000 0000 00
    bic: TESTDEFFXXX
    bank-name: Test Bank
  # Fake test-mode keys: tests never talk to Stripe (FakeStripeGateway), but the webhook
  # signature check runs for real with this secret.
  stripe:
    secret-key: sk_test_fake_for_tests
    publishable-key: pk_test_fake_for_tests
    webhook-secret: whsec_test_secret_for_tests
  # Fake sandbox credentials: tests never talk to PayPal (FakePayPalGateway decides whether a
  # webhook delivery is genuine).
  paypal:
    client-id: test-paypal-client-id
    client-secret: test-paypal-client-secret
    webhook-id: TEST-WEBHOOK-ID
    environment: sandbox
  # Sign in with Google: the tests replace Google with a local stand-in (support/FakeGoogle).
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret

springdoc:
  api-docs:
    enabled: true

---
# Lower thresholds so lockout and rate limits can be tested with few requests.
app:
  security:
    max-failed-logins: 3
  rate-limits:
    # Many tests enter coupons from the same address; the limit has its own test.
    cart-coupon:
      capacity: 200
      period: PT1M
    login-email:
      capacity: 8
      period: PT15M
    password-check:
      capacity: 4
      period: PT15M
    # Setup takes one check; the tests then need a full sign-in's worth of wrong codes.
    two-factor:
      capacity: 8
      period: PT15M

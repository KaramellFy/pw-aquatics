app:
  cookies:
    secure: false
  outbox:
    scheduler-enabled: false
  mail:
    shop-inbox: shop@test.local
  media:
    local-path: ${java.io.tmpdir}/pw-aquatics-test-media
  bank-transfer:
    account-holder: PW Aquatics Test
    iban: DE00 0000 0000 0000 0000 00
    bic: TESTDEFFXXX
    bank-name: Test Bank
  # Fake test-mode keys: tests never talk to Stripe (FakeStripeGateway), but the webhook
  # signature check runs for real with this secret.
  stripe:
    secret-key: sk_test_fake_for_tests
    publishable-key: pk_test_fake_for_tests
    webhook-secret: whsec_test_secret_for_tests

springdoc:
  api-docs:
    enabled: true

---
# Lower thresholds so lockout and rate limits can be tested with few requests.
app:
  security:
    max-failed-logins: 3
  rate-limits:
    login-email:
      capacity: 8
      period: PT15M
    password-check:
      capacity: 4
      period: PT15M

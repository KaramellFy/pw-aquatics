# Dependency alerts and update pull requests (docs/OPERATIONS.md, "Keeping it up to date").
# Security updates arrive as soon as an advisory is published; version updates once a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.x until typescript-eslint supports 7 (AGENTS.md §3).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

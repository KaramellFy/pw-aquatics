name: Production stack

# Builds the real Docker images and starts docker-compose.prod.yml the way a server would, then
# checks that the shop answers through the edge proxy (docs/OPERATIONS.md).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/production.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/production.yml'

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file ci.env
    steps:
      - uses: actions/checkout@v4

      - name: Check the backup scripts
        run: shellcheck -s sh infra/backup/*.sh

      # Throwaway values: "localhost" makes Caddy use its own test certificate instead of
      # Let's Encrypt, and no email leaves the runner (nothing listens on the SMTP host).
      - name: Write a test configuration
        run: |
          {
            echo "SHOP_DOMAIN=localhost"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SMTP_HOST=localhost"
            echo "SMTP_USERNAME=ci"
            echo "SMTP_PASSWORD=ci"
            echo "MAIL_FROM=PW Aquatics <shop@example.com>"
            echo "SHOP_INBOX_EMAIL=inbox@example.com"
            echo "BACKUP_DIR=./ci-backups"
          } > ci.env
          $COMPOSE config --quiet

      - name: Build the images
        run: $COMPOSE build

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 300

      - name: The shop answers through the edge proxy
        run: |
          curl -fsSk https://localhost/health | grep -q '"UP"'
          curl -fsSk https://localhost/ | grep -q 'og:title'
          curl -fsSk https://localhost/de/shop -o /dev/null
          curl -fsSk https://localhost/api/v1/shop-info -o /dev/null
          curl -fsSk https://localhost/sitemap.xml | grep -q '<urlset'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/actuator/health)" = 404
          curl -sIk https://localhost/ | grep -qi '^strict-transport-security'

      - name: A backup can be made and restored
        run: |
          $COMPOSE exec -T backup sh /opt/backup/backup.sh
          backup=$(ls ci-backups | head -1)
          $COMPOSE stop backend backup
          $COMPOSE run --rm -T restore "$backup" --yes
          $COMPOSE start backend backup
          $COMPOSE up -d --wait --wait-timeout 300
          curl -fsSk https://localhost/health | grep -q '"UP"'

      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Stop
        if: always()
        run: $COMPOSE down -v
